name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint scripts
        run: shellcheck scripts/*.sh

  integration:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run setup-gpc
        id: setup
        uses: ./
        with:
          service-account-json: '{"type":"service_account","project_id":"demo"}'
          developer-id: "1234567890123456789"
      - name: Verify install and auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ steps.setup.outputs.version }}"
          test -n "${{ steps.setup.outputs.binary-path }}"
          [[ "${{ steps.setup.outputs.auth-configured }}" == "true" ]]
          gpc --version | tee version.json
          gpc auth status --output json | tee auth-status.json
          python3 - <<'PY'
          import json
          with open("version.json", "r", encoding="utf-8") as fh:
              version = json.load(fh)
          with open("auth-status.json", "r", encoding="utf-8") as fh:
              status = json.load(fh)
          assert version["version"], version
          assert status["activeProfile"] == "default", status
          PY
